<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mídia Kit · Diego Garcia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600;700&display=swap">
<style>
  :root{--cream:#F2ECE3;--ink:#1C1B18;--navy:#13303F;--rust:#A94F2C;--peach:#E7A07C;--line:#CFC5B6;--muted:#5E574D}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#E6DED2;font-family:Manrope,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .kit{max-width:600px;margin:0 auto;background:var(--cream);box-shadow:0 0 40px rgba(0,0,0,.08)}
  .kit img{display:block;width:100%;height:auto;aspect-ratio:1080/1350;background:var(--cream)}
  .contact{background:var(--navy);color:var(--cream);padding:36px 24px 40px;display:flex;flex-direction:column;gap:14px}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--peach)}
  .contact h2{margin:0 0 6px;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:40px;line-height:1}
  .contact h2 em{font-style:italic}
  .btn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:6px;text-decoration:none;font-weight:700;font-size:15px}
  .btn.primary{background:var(--cream);color:var(--navy)}
  .btn.ghost{border:1px solid rgba(242,236,227,.35);color:var(--cream)}
  .btn small{display:block;font-weight:500;font-size:13px;opacity:.75;margin-top:2px}
  .back{display:block;text-align:center;padding:22px 16px 30px;font-size:13px;color:var(--muted);font-weight:600;text-decoration:none;letter-spacing:.04em}
  .back:hover{color:var(--rust)}
</style>
</head>
<body>
<main class="kit">
  <img src="kit-1.jpg" alt="Capa do mídia kit: Diego Garcia, 15 mil seguidores, 2 milhões de views em 30 dias, 89% do público no Brasil">
  <img src="kit-2.jpg" alt="01 — Quem sou: a história do Diego, o que o motiva, base, idiomas e temas" loading="lazy">
  <img src="kit-3.jpg" alt="02 — Números: 2 milhões de visualizações em 30 dias, 1,48 milhão de contas alcançadas, 178 mil interações, 17% de engajamento" loading="lazy">
  <img src="kit-4.jpg" alt="03 — Audiência: brasileiros de 25 a 44 anos, faixa etária, países e horário de pico" loading="lazy">
  <img src="kit-5.jpg" alt="04 — Conteúdo: Reel destaque, mais vistos dos últimos 180 dias e marcas parceiras" loading="lazy">
  <img src="kit-6.jpg" alt="05 — Formatos e valores de parceria, em reais e euros" loading="lazy">

  <section class="contact">
    <div class="kicker">Vamos criar juntos</div>
    <h2>Diego <em>Garcia</em></h2>
    <a class="btn primary" href="https://wa.me/5561992481881">

    </a>
    <a class="btn ghost" href="mailto:diegomgarcia62@gmail.com">
      <span>E-mail<small>diegomgarcia62@gmail.com</small></span><span>↗</span>
    </a>
  </section>

</html>
